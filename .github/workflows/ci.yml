name: CI Quality & Security Pipeline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 🛡️ Quality Gate (Lint, Types, Schema & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Validate Prisma Schema & Generate Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
        run: |
          npm run prisma:validate
          npx prisma generate

      - name: 🔍 ESLint Analysis
        run: npm run lint -- --quiet

      - name: 🏷️ TypeScript Typecheck
        run: npm run typecheck

      - name: 🧪 Automated Test Suite (Vitest)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
        run: npm test

      - name: 🏗️ Production Build Verification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          NEXT_PUBLIC_APP_URL: https://akubrecah.com
          NEXT_PUBLIC_SUPER_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_SUPER_ADMIN_EMAIL || '' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder_for_ci' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_placeholder_for_ci' }}
        run: npm run build

  security-scan:
    name: 🔒 Security & Secret Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository (full depth for commit auditing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔑 Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ Audit npm dependencies
        run: |
          npm audit --omit=dev --audit-level=high

  vercel-preview:
    name: 🚀 Vercel Preview Deployment
    needs: [quality-gate, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 📥 Checkout repository
        if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel Environment Information
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Project Artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy Preview to Vercel
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: 💬 Comment Preview URL on Pull Request
        if: env.VERCEL_TOKEN != '' && steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            if (previewUrl) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ **Vercel Preview Deployment Ready!**\n\n🔗 **Preview URL:** ${previewUrl}\n\n*Deployed from commit ${context.sha.substring(0, 7)}*`
              });
            }

  notify-status:
    name: 📢 Pipeline Telemetry & Alert
    needs: [quality-gate, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📱 Dispatch Status Notification
        env:
          EVOLUTION_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE_NAME || 'Akubrecah Entertainment' }}
          ADMIN_PHONE: ${{ secrets.ADMIN_WHATSAPP_PHONE || '' }}
          WEBHOOK_URL: ${{ secrets.WHATSAPP_NOTIFICATION_WEBHOOK }}
          GATE_STATUS: ${{ needs.quality-gate.result }}
          SEC_STATUS: ${{ needs.security-scan.result }}
        run: |
          STATUS="SUCCESS ✅"
          if [ "$GATE_STATUS" != "success" ] || [ "$SEC_STATUS" != "success" ]; then
            STATUS="FAILED ❌"
          fi

          MESSAGE=$(printf "Akubrecah KRA CI Pipeline Alert\n\n• Status: %s\n• Event: %s\n• Branch: %s\n• Commit: %s\n• Author: %s\n\nRun Link: https://github.com/%s/actions/runs/%s" \
            "$STATUS" "${{ github.event_name }}" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" "${{ github.repository }}" "${{ github.run_id }}")

          # 1. Custom Webhook if configured
          if [ -n "$WEBHOOK_URL" ]; then
            echo "Sending notification to webhook..."
            PAYLOAD=$(jq -n --arg text "$MESSAGE" --arg status "$STATUS" --arg repo "${{ github.repository }}" '{text:$text, status:$status, repo:$repo}')
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || true
          fi

          # 2. Evolution API WhatsApp if configured
          if [ -n "$EVOLUTION_URL" ] && [ -n "$EVOLUTION_KEY" ] && [ -n "$ADMIN_PHONE" ]; then
            echo "Sending WhatsApp notification via Evolution API..."
            CLEAN_PHONE=$(echo "$ADMIN_PHONE" | tr -cd '0-9')
            ENCODED_INST=$(jq -nr --arg s "$EVOLUTION_INSTANCE" '$s|@uri')
            WA_PAYLOAD=$(jq -n --arg number "$CLEAN_PHONE" --arg text "$MESSAGE" '{number:$number, text:$text}')
            curl -s -X POST "${EVOLUTION_URL}/message/sendText/${ENCODED_INST}" \
              -H "apikey: ${EVOLUTION_KEY}" \
              -H "Content-Type: application/json" \
              -d "$WA_PAYLOAD" || true
          fi

          echo "Notification step completed."
