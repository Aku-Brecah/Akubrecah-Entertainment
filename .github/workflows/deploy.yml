name: Production Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  production-deploy:
    name: 🚀 Production Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔑 Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Validate Prisma Schema & Generate Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
        run: |
          npm run prisma:validate
          npx prisma generate

      - name: 🔍 ESLint Analysis
        run: npm run lint -- --quiet

      - name: 🏷️ TypeScript Typecheck
        run: npm run typecheck

      - name: 🧪 Automated Test Suite (Vitest)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
        run: npm test

      - name: 🏗️ Production Build Verification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          NEXT_PUBLIC_APP_URL: https://akubrecah.com
          NEXT_PUBLIC_SUPER_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_SUPER_ADMIN_EMAIL || '' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder_for_ci' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_placeholder_for_ci' }}
        run: npm run build

      - name: 📦 Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel Production Environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Production Artifacts with Vercel
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          PROD_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"

      - name: 📢 Dispatch Production Deployment Alert
        if: always()
        env:
          EVOLUTION_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE_NAME || 'Akubrecah Entertainment' }}
          ADMIN_PHONE: ${{ secrets.ADMIN_WHATSAPP_PHONE || '' }}
          WEBHOOK_URL: ${{ secrets.WHATSAPP_NOTIFICATION_WEBHOOK }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          STATUS="SUCCESS"
          if [ "$BUILD_STATUS" != "success" ]; then
            STATUS="FAILED"
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s | head -c 80)
          MESSAGE=$(printf "Akubrecah KRA Production Release Alert\n\n• Status: %s\n• Branch: main\n• Commit: %s\n• Note: %s\n• Author: %s\n• Live URL: https://akubrecah.com\n\nAction Run: https://github.com/%s/actions/runs/%s" \
            "$STATUS" "${{ github.sha }}" "$COMMIT_MSG" "${{ github.actor }}" "${{ github.repository }}" "${{ github.run_id }}")

          # 1. Custom Webhook
          if [ -n "$WEBHOOK_URL" ]; then
            echo "Sending release notification to webhook..."
            PAYLOAD=$(jq -n --arg text "$MESSAGE" --arg status "$STATUS" --arg repo "${{ github.repository }}" '{text:$text, status:$status, repo:$repo}')
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || true
          fi

          # 2. WhatsApp Notification via Evolution API
          if [ -n "$EVOLUTION_URL" ] && [ -n "$EVOLUTION_KEY" ] && [ -n "$ADMIN_PHONE" ]; then
            echo "Sending WhatsApp notification via Evolution API..."
            CLEAN_PHONE=$(echo "$ADMIN_PHONE" | tr -cd '0-9')
            ENCODED_INST=$(jq -nr --arg s "$EVOLUTION_INSTANCE" '$s|@uri')
            WA_PAYLOAD=$(jq -n --arg number "$CLEAN_PHONE" --arg text "$MESSAGE" '{number:$number, text:$text}')
            curl -s -X POST "${EVOLUTION_URL}/message/sendText/${ENCODED_INST}" \
              -H "apikey: ${EVOLUTION_KEY}" \
              -H "Content-Type: application/json" \
              -d "$WA_PAYLOAD" || true
          fi

          echo "Deployment alert dispatched."
