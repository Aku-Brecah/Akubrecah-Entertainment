services:
  # Main Next.js application
  akubrecah-app:
    container_name: akubrecah_app
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPER_ADMIN_EMAIL: ${NEXT_PUBLIC_SUPER_ADMIN_EMAIL:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${APP_PORT:-3005}:3000"
      - "172.23.0.1:${APP_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-}
      - DIRECT_URL=${DIRECT_URL:-}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - NEXT_PUBLIC_SUPER_ADMIN_EMAIL=${NEXT_PUBLIC_SUPER_ADMIN_EMAIL:-}
      - ADMIN_BOT_PIN=${ADMIN_BOT_PIN:-}
      - N8N_DISPATCH_SECRET=${N8N_DISPATCH_SECRET:-}
      - INTERNAL_PROXY_SECRET=${INTERNAL_PROXY_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_WEBHOOK_SECRET=${EVOLUTION_WEBHOOK_SECRET:?Set EVOLUTION_WEBHOOK_SECRET in .env}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-Akubrecah Entertainment}
      - MPESA_DOWNLOAD_FEE_KES=${MPESA_DOWNLOAD_FEE_KES:-20}
      - MPESA_SUBSCRIPTION_AMOUNT_KES=${MPESA_SUBSCRIPTION_AMOUNT_KES:-500}
      - MPESA_ENV=${MPESA_ENV:-production}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY:-}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET:-}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE:-}
      - MPESA_TILL_NUMBER=${MPESA_TILL_NUMBER:-}
      - MPESA_PARTYB=${MPESA_PARTYB:-}
      - MPESA_TRANSACTION_TYPE=${MPESA_TRANSACTION_TYPE:-CustomerBuyGoodsOnline}
      - MPESA_CALLBACK_URL=${MPESA_CALLBACK_URL:-https://kra.akubrecah.com/api/mpesa/callback}
      - MPESA_CALLBACK_TOKEN=${MPESA_CALLBACK_TOKEN:-}
      - DARAJA_ENVIRONMENT=${DARAJA_ENVIRONMENT:-production}
      - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY:-}
      - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET:-}
      - DARAJA_PASSKEY=${DARAJA_PASSKEY:-}
      - DARAJA_SHORTCODE=${DARAJA_SHORTCODE:-}
      - DARAJA_TILL_NUMBER=${DARAJA_TILL_NUMBER:-}
      - DARAJA_PARTYB=${DARAJA_PARTYB:-}
      - DARAJA_TRANSACTION_TYPE=${DARAJA_TRANSACTION_TYPE:-CustomerBuyGoodsOnline}
      - DARAJA_CALLBACK_URL=${DARAJA_CALLBACK_URL:-https://kra.akubrecah.com/api/mpesa/callback}
      - DARAJA_CALLBACK_TOKEN=${DARAJA_CALLBACK_TOKEN:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - HMAC_SECRET=${HMAC_SECRET:-}
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://akubrecah.com}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./temp:/app/temp

  # Redis for rate limiting and caching (internal only, prevents host port 6379 collision)
  redis:
    container_name: redis_cache
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Evolution API for WhatsApp
  evolution:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8085}:8080"
      - "172.23.0.1:${EVOLUTION_PORT:-8085}:8080"
    expose:
      - "8080"
    environment:
      - SERVER_URL=${SERVER_URL:-https://wa.akubrecah.com}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      - DEL_INSTANCE=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Set EVOLUTION_DB_PASSWORD in .env}@evolution_postgres:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - REDIS_URI=redis://redis:6379
      - REDIS_PREFIX_KEY=evolution
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Akubrecah
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1020885143
      - WEBHOOK_GLOBAL_URL=http://akubrecah-app:3000/api/whatsapp/webhook?token=${EVOLUTION_WEBHOOK_SECRET:?Set EVOLUTION_WEBHOOK_SECRET in .env}
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_MESSAGES_DELETE=false
      - WEBHOOK_EVENTS_SEND_MESSAGE=false
      - WEBHOOK_EVENTS_CONTACTS_SET=false
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=false
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=false
      - WEBHOOK_EVENTS_PRESENCE_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_SET=false
      - WEBHOOK_EVENTS_CHATS_UPSERT=false
      - WEBHOOK_EVENTS_CHATS_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_DELETE=false
      - WEBHOOK_EVENTS_GROUPS_UPSERT=false
      - WEBHOOK_EVENTS_GROUPS_UPDATE=false
      - WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE=false
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
    volumes:
      - evolution-data:/evolution/instances
    depends_on:
      evolution_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated Postgres for Evolution WhatsApp instance state
  evolution_postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Set EVOLUTION_DB_PASSWORD in .env}
      POSTGRES_DB: evolution
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  evolution-data:
  evolution-postgres-data:
